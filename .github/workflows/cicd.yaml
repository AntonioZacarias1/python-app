name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Geerate Docker image tag
        id: image-tag
        run: |
          IMAGE_TAG=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: antzacarias808/python-app-2:${{ env.IMAGE_TAG }}
          provenance: false
          build-args: |
            BUILDKIT_PROGRESS=plain
    outputs:
      commit_id: ${{ env.IMAGE_TAG }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Modify values file
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.ci.outputs.commit_id }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{8}$ ]]; then
            echo "Invalid IMAGE_TAG: '$IMAGE_TAG'"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("charts/python-app/values.yaml")
          tag = os.environ["IMAGE_TAG"]

          lines = path.read_text().splitlines(keepends=True)

          inside_image = False
          image_indent = 0
          updated = 0

          for i, line in enumerate(lines):
              image_match = re.match(r'^(\s*)image:\s*(?:#.*)?(?:\r?\n)?$', line)

              if image_match:
                  inside_image = True
                  image_indent = len(image_match.group(1))
                  continue

              if inside_image:
                  if line.strip() and not line.lstrip().startswith("#"):
                      indent = len(line) - len(line.lstrip())

                      if indent <= image_indent:
                          inside_image = False

                  if inside_image:
                      tag_match = re.match(
                          r'^(\s*tag:\s*)(.*?)(\s+#.*)?(\r?\n)?$',
                          line
                      )

                      if tag_match:
                          prefix = tag_match.group(1)
                          comment = tag_match.group(3) or ""
                          newline = tag_match.group(4) or ""

                          lines[i] = f'{prefix}"{tag}"{comment}{newline}'
                          updated += 1

          if updated != 1:
              raise SystemExit(
                  f"Expected exactly one image.tag field, found {updated}"
              )

          path.write_text("".join(lines))

          print(f"Updated image.tag to: {tag}")
          PY

          echo "Resulting image configuration:"
          grep -A3 '^image:' charts/python-app/values.yaml

          git diff --check
          git diff -- charts/python-app/values.yaml

      - name: Commit tag
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updating tag for deploy by using commit: ${{ needs.ci.outputs.commit_id }}'

      - name: Install argocd
        shell: bash
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd

      - name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app