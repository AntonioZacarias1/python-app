name: ci

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Geerate Docker image tag
        id: image-tag
        run: |
          IMAGE_TAG=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: antzacarias808/python-app-2:${{ env.IMAGE_TAG }}
    outputs:
      commit_id: ${{ env.IMAGE_TAG }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: actions/checkout@v3

      - name: Modify values file
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.commit_id }}
          pip3 install yq
          yq -Yi '.image.tag = ${{ needs.ci.outputs.commit_id }}' charts/python-app/values.yaml

      - name: Commit tag
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updating tag for deploy by using commit: ${{ needs.ci.outputs.commit_id }}'

      - name: Install argocd
        shell: bash
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd

      - name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app
